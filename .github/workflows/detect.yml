name: Detect
# Daily detection of newly funded campaigns. Discovery is via PostHog
# (Fivetran-mirrored postgres.campaigns); per-campaign content is still
# scraped from invest.honeycombcredit.com inside runPipeline(). The script
# opens a tracking issue per newly-funded campaign that clears the rate-limit
# gate, generates the case study, and commits the MDX + hero image. The
# detection-log row is appended on every run (including dry-run).

on:
  # ─── PAUSED ────────────────────────────────────────────────────────────
  # Daily cron disabled per operator request (Tyler, 2026-06-09) to stop
  # Anthropic API spend while the project is on hold. Both slots are
  # commented out together; resume by uncommenting these lines.
  # workflow_dispatch remains active so the cron can be re-armed
  # one-off from the Actions tab without editing this file.
  #
  # schedule:
  #   # Two daily slots. GitHub Actions silently drops or delays scheduled
  #   # workflows during high-load periods, and we cannot predict which slots
  #   # will be hit on a given day. The script is idempotent — already-
  #   # published campaigns are filtered out by `listAllCampaignSlugs()`
  #   # before any rate-limit consumption — so running twice/day costs nothing
  #   # when the first run lands cleanly, and rescues the day when it doesn't.
  #   #
  #   # Empirical track record (last 5 days):
  #   #   12:07 UTC slot — fired within 30 min (1 sample)
  #   #   08:13 UTC slot — fired 3+ hours late on 2 of 3 days, dropped on day 3
  #   #
  #   # 04:47 UTC = 00:47 EDT (overnight, low GH contention).
  #   # 11:23 UTC = 07:23 EDT (mid-morning backup, off the :00/:30 spikes).
  #   - cron: '47 4 * * *'
  #   - cron: '23 11 * * *'
  # ───────────────────────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (skip generation, only scan)'
        required: false
        default: 'false'

permissions:
  contents: write
  issues: write
  # actions: write is required for the explicit `gh workflow run deploy.yml`
  # step at the end. Without it, the dispatch call 403s.
  actions: write

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Run detection
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # PostHog discovery — replaces the listing-scrape blind spot.
          # POSTHOG_API_KEY: personal API key with project:query:read
          # POSTHOG_PROJECT_ID: numeric project ID (Honeycomb Credit Production)
          # Both must be added at .../settings/secrets/actions.
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: ${{ secrets.POSTHOG_PROJECT_ID }}
          FUNDED_BOT_IDENTITY: '1'
        run: |
          if [[ "${{ inputs.dry-run }}" == "true" ]]; then
            npx tsx scripts/detect.ts --dry-run
          else
            npx tsx scripts/detect.ts
          fi

      - name: Push commits
        id: push
        if: ${{ inputs.dry-run != 'true' }}
        run: |
          # detect.ts commits state changes + per-slug content commits.
          # Capture push output so the next step can decide whether the
          # deploy needs to fire.
          set +e
          out=$(git push origin HEAD:main 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "Nothing to push (or push failed)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "Everything up-to-date"; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        # Pushes authenticated with the default GITHUB_TOKEN don't trigger
        # downstream `push:` workflows (GitHub's recursion safeguard).
        # workflow_dispatch IS an exception, so we explicitly dispatch
        # deploy.yml here whenever the cron actually pushed content.
        # https://docs.github.com/en/actions/reference/events-that-trigger-workflows#triggering-a-workflow-from-a-workflow
        if: ${{ inputs.dry-run != 'true' && steps.push.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
