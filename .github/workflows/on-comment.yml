name: On Comment
# Listens for /funded slash commands in issue/PR comments. The auth boundary
# is `author_association` (OWNER, COLLABORATOR, MEMBER) — non-collaborators
# are silently ignored.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  # actions: write is required for the explicit `gh workflow run deploy.yml`
  # step at the end. Without it, the dispatch call 403s.
  actions: write

jobs:
  dispatch:
    if: |
      startsWith(github.event.comment.body, '/funded ') &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'COLLABORATOR' ||
        github.event.comment.author_association == 'MEMBER'
      )
    runs-on: ubuntu-latest
    steps:
      - name: React to command
        # Acknowledge receipt so the user sees it landed before the run completes.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -d '{"content":"eyes"}' >/dev/null

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Dispatch /funded command
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FUNDED_BOT_IDENTITY: '1'
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_USER: ${{ github.event.comment.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: npx tsx scripts/dispatch-comment.ts

      - name: Push commits
        id: push
        run: |
          set +e
          out=$(git push origin HEAD:main 2>&1)
          rc=$?
          set -e
          echo "$out"
          if [ $rc -ne 0 ]; then
            echo "Nothing to push (or push failed)."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          elif echo "$out" | grep -q "Everything up-to-date"; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        # Pushes authenticated with the default GITHUB_TOKEN don't trigger
        # downstream `push:` workflows. workflow_dispatch is an exception,
        # so we explicitly dispatch deploy.yml when /funded {generate,
        # redraft,delete} actually pushed a content commit.
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
