name: On Issue
# Routes Issue Form submissions (Backfill, Redraft with feedback) to the
# matching CLI.
#
# Routing key: title prefix (`[Backfill]` / `[Redraft]`). Robust against the
# silent-label-drop GitHub does when an Issue Form's `labels:` list contains
# labels that don't yet exist in the repo. Title prefixes are part of the
# template itself and can't be dropped.
#
# Trigger types: opened (first submission), edited (operator fixed something),
# labeled (operator manually applied a routing label, or recovered a
# previously-skipped issue). The `dispatched` label is added by the workflow
# after success and short-circuits the if-condition on subsequent triggers.

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

# Serialize per-issue runs so two near-simultaneous triggers (e.g. opened +
# labeled within the same second) don't both clear the dispatched-label
# guard before either has run.
concurrency:
  group: on-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: |
      (
        startsWith(github.event.issue.title, '[Backfill]') ||
        startsWith(github.event.issue.title, '[Redraft]')
      ) && !contains(github.event.issue.labels.*.name, 'dispatched')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Dispatch issue form
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FUNDED_BOT_IDENTITY: '1'
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: npx tsx scripts/dispatch-issue.ts

      - name: Push commits
        if: always()
        run: git push origin HEAD:main || echo "Nothing to push."

      - name: Mark dispatched
        # Add a `dispatched` label as an anti-replay guard so subsequent
        # edits/label changes on the same issue don't re-fire the workflow.
        # Octokit auto-creates the label if it doesn't yet exist.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels" \
            -d '{"labels":["dispatched"]}' >/dev/null
