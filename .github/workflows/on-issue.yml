name: On Issue
# Routes Issue Form submissions (Backfill, Redraft with feedback) to the
# matching CLI. Each form auto-applies a `form: <name>` label; the dispatcher
# routes on the label.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  dispatch:
    if: |
      contains(github.event.issue.labels.*.name, 'form: backfill') ||
      contains(github.event.issue.labels.*.name, 'form: redraft-feedback')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Stringify labels
        id: labels
        env:
          LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          # Convert ["a","b"] → "a,b" for the dispatcher.
          echo "list=$(echo "$LABELS_JSON" | jq -r 'join(",")')" >> "$GITHUB_OUTPUT"

      - name: Dispatch issue form
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FUNDED_BOT_IDENTITY: '1'
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_LABELS: ${{ steps.labels.outputs.list }}
        run: npx tsx scripts/dispatch-issue.ts

      - name: Push commits
        run: git push origin HEAD:main || echo "Nothing to push."
