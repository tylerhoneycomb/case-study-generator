name: Generate Case Study
# One-click manual trigger for scripts/generate.ts. Mirrors the on-comment
# workflow's pipeline path (checkout main → npm ci → run generate → push)
# but takes inputs from the Actions UI instead of a /funded slash command.
# Useful when you'd rather click than type — and as a fallback when slash
# commands get intercepted by a local terminal or other tool.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Honeycomb campaign slug (from invest.honeycombcredit.com/campaigns/{slug})"
        required: true
        type: string
      issue:
        description: "Tracking issue number (optional — status comments post here if set)"
        required: false
        type: string
      force:
        description: "Force regenerate if a case study already exists for this slug"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FUNDED_BOT_IDENTITY: '1'
        run: |
          ARGS="${{ inputs.slug }}"
          if [[ -n "${{ inputs.issue }}" ]]; then
            ARGS="$ARGS --issue=${{ inputs.issue }}"
          fi
          if [[ "${{ inputs.force }}" == "true" ]]; then
            ARGS="$ARGS --force"
          fi
          npx tsx scripts/generate.ts $ARGS

      - name: Push commits
        run: git push origin HEAD:main || echo "Nothing to push."
